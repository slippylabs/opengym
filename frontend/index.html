<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var l = s.lang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en');
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
</script>
<title>openGym</title>
<meta name="description" content="openGym on slippylabs: a free gym and fitness tracker. Plans and a guided workout logger, progression, goals, daily check-ins, 12 fitness calculators, progress charts, streaks, XP and achievements. Works offline, no ads, no AI.">
<!-- Link previews (the slippylabs OG convention): absolute URLs, a 1200×630 card. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://fit.slippylabs.com/">
<meta property="og:title" content="openGym // fit.slippylabs.com">
<meta property="og:description" content="A free gym and fitness tracker: plans, a guided workout logger, goals, calculators, progress charts, streaks and achievements.">
<meta property="og:image" content="https://fit.slippylabs.com/og-image.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="openGym // fit.slippylabs.com">
<meta name="twitter:description" content="A free gym and fitness tracker: plans, a guided workout logger, goals, calculators, progress charts, streaks and achievements.">
<meta name="twitter:image" content="https://fit.slippylabs.com/og-image.png?v=2">
<meta name="theme-color" content="#0c0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="openGym">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
<!-- Slippy Deck: the sitewide floating Slippy TV + jukebox player. Renders nothing unless
     admin.slippylabs.com/whoami confirms a signed-in slippylabs account. -->
<script defer src="https://slippylabs.com/deck/deck.js"></script>
</body>
</html>
