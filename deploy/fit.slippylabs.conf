# fit.slippylabs.com: openGym (the slippylabs fork). The SPA from /var/www, /api proxied to the
# node API on 127.0.0.1:8044 (opengym.service). One origin, which passkeys require.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fit.slippylabs.com;
    include snippets/security-headers.conf;
    include snippets/block-dotfiles.conf;

    ssl_certificate     /etc/letsencrypt/live/slippylabs-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slippylabs-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/fit.slippylabs.com;
    index index.html;

    # Single sign-on with a slippylabs.com account (SSO_HEADER=X-SSO-User in /etc/opengym.env).
    # Only these two routes are told who the browser is: nginx asks the admin console
    # (service=any: any existing account) and passes the name on. Every other location sets the
    # header to empty, so a client can never claim a name itself.
    location = /_sso_any {
        internal;
        proxy_pass http://127.0.0.1:8004/auth-check?service=any;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
    }
    location @sso_none {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 '{"error":"not signed in to the site","code":"sso"}';
    }
    location ^~ /api/sso/ {
        auth_request /_sso_any;
        auth_request_set $sso_user $upstream_http_x_sso_user;
        error_page 401 403 = @sso_none;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8044;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-SSO-User $sso_user;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8044;
        proxy_http_version 1.1;
        proxy_set_header X-SSO-User "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # Photos and videos of custom exercises: streamed through, checked by the API as they arrive.
    location ^~ /api/media/ {
        client_max_body_size 48m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8044;
        proxy_http_version 1.1;
        proxy_set_header X-SSO-User "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The exercise animations never change under a name.
    location ^~ /exercise-media/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }
    # Vite names every asset by its content hash, so these are safe to pin.
    location ^~ /assets/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # The shell, the service worker and the manifest must never be stale: a cached sw.js or
    # index.html keeps serving the previous release.
    location = /sw.js {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /index.html {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location ~* \.(webmanifest|json)$ {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~* \.(png|jpe?g|webp|gif|ico|svg|woff2?)$ {
        include snippets/security-headers.conf;
        add_header Cache-Control "max-age=2592000, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    # The app routes with a hash, so everything else is the shell.
    location / {
        add_header Cache-Control "no-cache" always;
        include snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
